name: Broad Market Flow Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 10 * * 1-5'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests langchain langchain-openai akshare python-dotenv loguru

      - name: Run Market Flow Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python main.py
